<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Линк-био</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --bg: #0b0b0d;
    --panel: #141417;
    --panel-border: #232329;
    --text: #f2f1ec;
    --muted: #8b8b93;
    --accent-1: #7c5cff;
    --accent-2: #2fd3c9;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 20% 0%, rgba(124,92,255,0.15), transparent 45%),
      radial-gradient(circle at 80% 10%, rgba(47,211,201,0.10), transparent 40%);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    display:flex;
    justify-content:center;
    padding: 48px 16px 80px;
  }

  .page{
    width: 100%;
    max-width: 420px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .avatar-wrap{
    position:relative;
    width: 132px;
    height:132px;
    margin-bottom: 20px;
  }

  .avatar-ring{
    position:absolute;
    inset:-4px;
    border-radius:50%;
    background: conic-gradient(from 180deg, var(--accent-1), var(--accent-2), var(--accent-1));
    animation: spin 6s linear infinite;
  }

  @keyframes spin{ to{ transform: rotate(360deg); } }

  .avatar{
    position:relative;
    width:132px;
    height:132px;
    border-radius:50%;
    background: var(--panel);
    border: 4px solid var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 42px;
    font-weight:700;
    color: var(--text);
    overflow:hidden;
  }

  .name{
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin-bottom: 4px;
  }

  .tagline{
    font-family:'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 22px;
    text-align:center;
  }

  .socials{
    display:flex;
    gap: 14px;
    margin-bottom: 34px;
  }

  .social{
    width: 46px;
    height:46px;
    border-radius:50%;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    display:flex;
    align-items:center;
    justify-content:center;
    color: var(--text);
    transition: transform .15s ease, border-color .15s ease;
  }
  .social:hover{ transform: translateY(-2px); border-color: var(--accent-1); }
  .social svg{ width:20px; height:20px; }

  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap: 14px;
  }

  .link-card{
    position:relative;
    display:flex;
    align-items:center;
    gap: 14px;
    width:100%;
    padding: 12px 16px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    text-decoration:none;
    color: var(--text);
    overflow:hidden;
    transition: border-color .2s ease, transform .15s ease;
  }

  .link-card:hover{
    border-color: var(--accent-1);
    transform: translateY(-2px);
  }

  .link-thumb{
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    flex-shrink:0;
    overflow:hidden;
  }
  .link-thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .link-label{
    flex:1;
    font-size: 14px;
    font-weight:600;
    letter-spacing: 0.04em;
    text-transform:uppercase;
  }

  .link-arrow{
    color: var(--muted);
    font-size: 18px;
  }

  .feature-card{
    display:block;
    width:100%;
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    overflow:hidden;
    background: var(--panel);
    text-decoration:none;
    color: inherit;
    transition: border-color .2s ease, transform .15s ease;
  }
  .feature-card:hover{
    border-color: var(--accent-1);
    transform: translateY(-2px);
  }

  .feature-media{
    width:100%;
    aspect-ratio: 4/5;
    background: #101012;
    overflow:hidden;
  }

  .feature-label{
    padding: 14px 16px;
    font-size:13px;
    font-weight:600;
    letter-spacing: 0.08em;
    text-transform:uppercase;
    text-align:center;
    color: var(--muted);
  }

  .footer-note{
    margin-top: 40px;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--panel-border);
    text-align:center;
  }
</style>
</head>
